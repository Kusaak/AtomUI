name: Build AtomUI ControlGallery (Windows)

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
      with:
        fetch-depth: 0
        submodules: recursive

    - name: Setup .NET SDK
      uses: actions/setup-dotnet@v5
      with:
        dotnet-version: '10.0.x'

    # ✅ 路线 A：完整移除 NumberUpDownShowCase（XAML + Code-behind）
    - name: Remove problematic NumberUpDown showcase
      shell: pwsh
      run: |
        # 1. 删除 View 文件
        $files = @(
          "controlgallery/AtomUIGallery/ShowCases/Views/DataEntry/NumberUpDownShowCase.axaml",
          "controlgallery/AtomUIGallery/ShowCases/Views/DataEntry/NumberUpDownShowCase.axaml.cs"
        )
    
        foreach ($file in $files) {
          if (Test-Path $file) {
            Write-Host "Removing $file"
            Remove-Item $file -Force
          }
        }
    
        # 2. 从 ShowCaseRegister.cs 中移除注册
        $registerFile = "controlgallery/AtomUIGallery/ShowCases/ShowCaseRegister.cs"
    
        if (Test-Path $registerFile) {
          Write-Host "Patching ShowCaseRegister.cs"
          (Get-Content $registerFile) |
            Where-Object { $_ -notmatch "NumberUpDownShowCase" } |
            Set-Content $registerFile
        }
    

    - name: Restore dependencies
      run: dotnet restore

    - name: Build ControlGallery
      run: dotnet build controlgallery/AtomUIGallery.Desktop -c Release

    - name: Publish Windows x64
      run: dotnet publish controlgallery/AtomUIGallery.Desktop `
            -c Release `
            -f net8.0 `
            -r win-x64 `
            --self-contained false `
            -o publish

    - name: Upload artifact
      uses: actions/upload-artifact@v4
      with:
        name: AtomUI-ControlGallery-win-x64
        path: publish
